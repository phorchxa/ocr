name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The modules under test (geometry, gestures, fingers) import only
      # numpy, so CI skips the heavy MediaPipe and OpenCV wheels.
      - name: Install lint and test dependencies
        run: python -m pip install numpy pytest ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest
